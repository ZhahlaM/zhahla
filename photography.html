<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zhahla Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300..700;1,300..700&family=DM+Mono:wght@400&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <a class="wordmark" href="index.html">Zhahla</a>
    <nav aria-label="Sections">
      <a href="photography.html" aria-current="page">Photography</a>
      <a href="index.html#kitchen">Kitchen</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <div class="page-intro">
    <h1>Photography</h1>
    <a class="label" href="https://www.instagram.com/imnotapicaholic/" target="_blank" rel="noopener">@imnotapicaholic ↗</a>
  </div>
</div>

<main>
  <section class="set wrap" aria-labelledby="set-0">
    <div class="set-head">
      <h2 id="set-0">Woods</h2>
      <span class="label">2 photographs</span>
    </div>
    <div class="row">
      <figure class="frame" style="--r: 1125 / 746; --g: 1.508">
        <button type="button" aria-label="View Woodland larger">
          <img src="images/woodland.jpg" alt="Sunlit clearing in an old oak wood, a pale trunk leaning across long green grass and small tree stumps" width="1125" height="746">
        </button>
        <figcaption><span class="title">Woodland</span><span class="label">35mm film</span></figcaption>
      </figure>
      <figure class="frame" style="--r: 750 / 1125; --g: 0.667">
        <button type="button" aria-label="View Moss and peel larger">
          <img src="images/moss-and-peel.jpg" alt="A banana peel on a woodland floor of moss and dry leaves, in front of a moss-covered concrete step" width="750" height="1125">
        </button>
        <figcaption><span class="title">Moss and peel</span><span class="label">Digital</span></figcaption>
      </figure>
    </div>
  </section>

  <section class="set wrap" aria-labelledby="set-1">
    <div class="set-head">
      <h2 id="set-1">Coast</h2>
      <span class="label">2 photographs</span>
    </div>
    <div class="row">
      <figure class="frame" style="--r: 1125 / 746; --g: 1.508">
        <button type="button" aria-label="View Lighthouse at dusk larger">
          <img src="images/lighthouse.jpg" alt="A lighthouse on top of a white chalk cliff at dusk, the sea and a low sun behind clouds, with a red light leak in the corner" width="1125" height="746" loading="lazy">
        </button>
        <figcaption><span class="title">Lighthouse at dusk</span><span class="label">35mm film</span></figcaption>
      </figure>
      <figure class="frame" style="--r: 1125 / 746; --g: 1.508">
        <button type="button" aria-label="View The island larger">
          <img src="images/island.jpg" alt="A low green island seen across sparkling water, with a small white lighthouse and a ruined stone tower on the horizon" width="1125" height="746" loading="lazy">
        </button>
        <figcaption><span class="title">The island</span><span class="label">35mm film</span></figcaption>
      </figure>
    </div>
  </section>

  <section class="set wrap" aria-labelledby="set-2">
    <div class="set-head">
      <h2 id="set-2">Canal</h2>
      <span class="label">2 photographs</span>
    </div>
    <div class="row">
      <figure class="frame" style="--r: 1500 / 2000; --g: 0.750">
        <button type="button" aria-label="View Reflections larger">
          <img src="images/canal-reflection.jpg" alt="A bicycle reflected in dark canal water beside a moored boat, with autumn leaves floating on the surface" width="1500" height="2000" loading="lazy">
        </button>
        <figcaption><span class="title">Reflections</span><span class="label">Phone</span></figcaption>
      </figure>
      <figure class="frame" style="--r: 1500 / 2000; --g: 0.750">
        <button type="button" aria-label="View Under the bridge larger">
          <img src="images/under-the-bridge.jpg" alt="Canal towpath seen through sticker-covered railings, with warm light on the brick arch of a bridge" width="1500" height="2000" loading="lazy">
        </button>
        <figcaption><span class="title">Under the bridge</span><span class="label">Phone</span></figcaption>
      </figure>
    </div>
  </section>

  <section class="set wrap" aria-labelledby="set-3">
    <div class="set-head">
      <h2 id="set-3">City in black &amp; white</h2>
      <span class="label">2 photographs</span>
    </div>
    <div class="row">
      <figure class="frame" style="--r: 745 / 1125; --g: 0.662">
        <button type="button" aria-label="View The old tree larger">
          <img src="images/old-tree.jpg" alt="Black and white photo of a large, sprawling tree in front of a building and a railing, sunlight coming through its leaves" width="745" height="1125" loading="lazy">
        </button>
        <figcaption><span class="title">The old tree</span><span class="label">35mm B&amp;W film</span></figcaption>
      </figure>
      <figure class="frame" style="--r: 745 / 1125; --g: 0.662">
        <button type="button" aria-label="View Passage larger">
          <img src="images/passage.jpg" alt="Black and white photo of a shaded passage under a building, opening onto a bright courtyard where a figure in white walks away" width="745" height="1125" loading="lazy">
        </button>
        <figcaption><span class="title">Passage</span><span class="label">35mm B&amp;W film</span></figcaption>
      </figure>
    </div>
  </section>
</main>

<div class="wrap">
  <footer>
    <a class="label" href="index.html">← Back to home</a>
    <span class="label">© 2026 Zhahla</span>
  </footer>
</div>

<dialog class="lightbox" id="lightbox" aria-label="Photograph viewer">
  <div class="lb-inner">
    <img id="lb-img" src="" alt="">
    <div class="lb-bar">
      <button class="lb-btn" type="button" id="lb-prev">← Prev</button>
      <span id="lb-title"></span>
      <span class="label" id="lb-meta"></span>
      <button class="lb-btn" type="button" id="lb-next">Next →</button>
      <button class="lb-btn" type="button" id="lb-close">Close ✕</button>
    </div>
  </div>
</dialog>

<script src="js/site.js"></script>
</body>
</html>
